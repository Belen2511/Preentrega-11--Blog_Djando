{% extends "posts/base.html" %}
{% block title %}Editar perfil{% endblock %}
{% block content %}
<h1>Editar perfil</h1>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ usuario_form.as_p }}
  {{ perfil_form.as_p }}
  <button type="submit">Guardar cambios</button>
  <a href="{% url 'perfil' %}">Cancelar</a>
</form>
{% endblock %}
