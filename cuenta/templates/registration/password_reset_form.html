{% extends "posts/base.html" %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<h1>Recuperar contraseña</h1>
<p>Ingresá el correo de tu cuenta y te enviamos un enlace para elegir una contraseña nueva.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Enviar enlace</button>
</form>
{% endblock %}
